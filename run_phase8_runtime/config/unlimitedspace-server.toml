#Galaxy shape: SPIRAL, ELLIPTICAL or IRREGULAR.
#Allowed Values: SPIRAL, ELLIPTICAL, IRREGULAR
type = "SPIRAL"
#Galaxy radius in abstract galaxy units.
# Default: 100.0
# Range: 8.0 ~ 100000.0
radius = 100.0
#Average star density (stars per square unit).
# Default: 0.8
# Range: 0.001 ~ 100.0
starDensity = 0.8
#Finite test/playable navigation scope: number of star systems resolved for
#startup statistics and admin navigation, indices [0 .. N-1]. This bound is
#deliberately finite: statistics and navigation NEVER materialize the whole
#potential galaxy, only this configured slice.
# Default: 128
# Range: 1 ~ 1000000
testSystemCount = 128
